<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Journal Typesetting Studio{% endblock %}</title>
<style>
:root { --ink:#1d2430; --muted:#5b6573; --line:#d6dbe2; --bg:#f6f7f9; --card:#fff; --accent:#1f3b63;
        --pass:#1e7a46; --warning:#9a6a00; --blocked:#b3261e; --manual:#5b3ea8; --na:#6b7280; }
* { box-sizing: border-box; }
body { margin:0; font:15px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--bg); }
header { background:var(--accent); color:#fff; padding:.6rem 1.2rem; display:flex; gap:1.5rem; align-items:center; flex-wrap:wrap; }
header a { color:#fff; text-decoration:none; font-weight:600; }
header form { margin-left:auto; display:flex; gap:.4rem; align-items:center; }
header input { padding:.25rem .4rem; border:0; border-radius:3px; }
main { max-width:1180px; margin:1.2rem auto; padding:0 1rem; }
.card { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:1rem 1.2rem; margin-bottom:1rem; }
h1 { font-size:1.45rem; margin:.2rem 0 .6rem; } h2 { font-size:1.15rem; margin:.2rem 0 .7rem; } h3 { font-size:1rem; margin:.8rem 0 .4rem; }
table { border-collapse:collapse; width:100%; } th, td { text-align:left; padding:.35rem .5rem; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-size:.82rem; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); }
.muted { color:var(--muted); } .small { font-size:.85rem; }
.badge { display:inline-block; padding:.05rem .45rem; border-radius:3px; font-size:.78rem; font-weight:600; color:#fff; white-space:nowrap; }
.s-pass { background:var(--pass); } .s-warning { background:var(--warning); } .s-blocked { background:var(--blocked); }
.s-manual { background:var(--manual); } .s-na { background:var(--na); } .s-acked { background:#3f6f8f; }
.st-proof { background:var(--accent); } .st-approved { background:var(--pass); } .st-diagnostic { background:var(--warning); }
.st-blocked, .st-failed { background:var(--blocked); }
.ready { color:var(--pass); font-weight:700; } .notready { color:var(--blocked); font-weight:700; }
.flash { padding:.6rem .9rem; border-radius:4px; margin-bottom:.8rem; } .flash.ok { background:#e6f4ea; } .flash.error { background:#fbe9e7; }
label { display:block; font-size:.85rem; color:var(--muted); margin-top:.4rem; }
input[type=text], input[type=date], input[type=url], select, textarea { width:100%; padding:.35rem .45rem; border:1px solid var(--line); border-radius:4px; font:inherit; }
textarea.code { font:13px/1.45 ui-monospace, Consolas, monospace; min-height:28rem; }
button { background:var(--accent); color:#fff; border:0; border-radius:4px; padding:.4rem .9rem; font:inherit; cursor:pointer; }
button.secondary { background:#596579; }
.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:.4rem 1rem; }
.pages img { width:100%; max-width:595px; border:1px solid var(--line); margin:.4rem 0; display:block; }
a { color:var(--accent); }
.field { font-family:ui-monospace, Consolas, monospace; font-size:.8rem; color:var(--muted); }
:focus-visible { outline:3px solid #f0a020; outline-offset:2px; }
</style>
</head>
<body>
<header>
  <a href="{{ url_for('index') }}">Journal Typesetting Studio</a>
  <a href="{{ url_for('index') }}">Articles</a>
  <a href="{{ url_for('journals') }}">Journals and evidence</a>
  <form method="post" action="{{ url_for('set_editor') }}">
    <label for="editor-name" style="color:#fff;margin:0">Your name</label>
    <input id="editor-name" name="editor" value="{{ editor }}" placeholder="recorded with approvals">
    <button class="secondary">Set</button>
  </form>
</header>
<main>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}<div class="flash {{ cat }}" role="status">{{ msg }}</div>{% endfor %}
{% endwith %}
{% block body %}{% endblock %}
</main>
</body>
</html>
