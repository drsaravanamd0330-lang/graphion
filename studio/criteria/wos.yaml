# Journal-level evidence checklist. This is a working summary, not the
# official text. Confirm every item against the official source before
# relying on it, then record the date you checked in "last_checked".
index: wos
name: Web of Science Core Collection
version: 1
official_sources:
  - label: Web of Science editorial selection process (Clarivate). Find the current page from clarivate.com, since the address changes.
    url: https://clarivate.com/
last_checked: null
verification: unverified
verification_note: >-
  Written from general knowledge on 2026-11-26. The official pages could not be
  opened from the build environment and the exact address of the selection
  process page was not confirmed, so the link is to the Clarivate homepage.
criteria:
  - id: issn
    text: The journal has an ISSN (initial triage).
    evidence_hint: ISSN portal record.
    auto: issn
  - id: title-identity
    text: Journal title, publisher and URL are consistent and identifiable (initial triage).
    evidence_hint: Journal homepage.
  - id: content-access
    text: Content is accessible to the editorial team for evaluation (initial triage).
    evidence_hint: Login or open access to recent issues.
  - id: peer-review-policy
    text: Peer review policy is stated (initial triage).
    evidence_hint: Peer review policy page.
  - id: contact-details
    text: Contact details are available (initial triage).
    evidence_hint: Contact page.
  - id: english-metadata
    text: Article titles and abstracts are in English, with bibliographic information in Roman script (editorial triage).
    evidence_hint: Sample of recent articles.
    auto: english_abstracts
  - id: editorial-board
    text: Editorial board composition is consistent with the journal scope (editorial evaluation, quality).
    evidence_hint: Editorial board page.
  - id: content-relevance
    text: Content is relevant to the stated scope, with appropriate citations (editorial evaluation, quality).
    evidence_hint: Sample of recent articles.
  - id: punctuality
    text: Publication is timely and on the stated schedule (editorial evaluation, quality).
    evidence_hint: Issue dates over recent years.
  - id: ethics
    text: Clear statements of ethics and adherence to community standards (editorial evaluation, quality).
    evidence_hint: Ethics policy page.
